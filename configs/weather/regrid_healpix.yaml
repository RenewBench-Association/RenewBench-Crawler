raw_data_base_dir: /lsdf/raw/weather/
dst_data_base_dir: /lsdf/processed/weather/healpix/
healpix_min_level: 0
healpix_max_level:
  era5: 8
  barra2_r2: 9
  barra2_c2: 11
  barra2_c2_20min: 11
  icon_dream_global: 9
  icon_dream_eu: 10
compressor: zlib
compression_level: 1
shuffle: true
block_memory_mb: 8192  # ~20 GB peak RSS on ICON global 3D; below 8192, 3D variables get shorter Zarr chunks
